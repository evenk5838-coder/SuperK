<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperK</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="window">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">产品</span>
        <button id="new-product" class="icon-btn" type="button" title="新建产品" aria-label="新建产品">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        </button>
      </div>
      <ul id="product-list" class="product-list"></ul>
      <p id="sidebar-empty" class="sidebar-empty hidden">还没有产品</p>
    </aside>

    <main class="main">
      <header class="toolbar">
        <h1 id="product-title" class="toolbar-title">SuperK</h1>
        <div id="mode-seg" class="segmented hidden" role="radiogroup" aria-label="驱动方式"></div>
        <div class="toolbar-spacer"></div>
        <button id="toggle-preview" class="icon-btn hidden" type="button" title="预览" aria-label="显示或隐藏预览">
          <svg viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg>
        </button>
      </header>

      <section id="empty" class="empty">
        <img src="/icon.png" alt="" class="empty-icon">
        <h2>从一句话想法开始</h2>
        <p>一个产品一条主线。对话里的想法、链接和文件都会落到这个产品的 Markdown 里。</p>
        <button type="button" class="push-btn primary" data-action="open-new">新建产品</button>
      </section>

      <section id="chat" class="chat hidden">
        <div id="transcript" class="transcript"></div>
        <form id="composer" class="composer">
          <div class="composer-box">
            <textarea id="draft" rows="1" placeholder="输入消息"></textarea>
            <div class="composer-bar">
              <button id="attach" class="icon-btn" type="button" title="添加文件" aria-label="添加文件">
                <svg viewBox="0 0 16 16"><path d="M13 7.5 8 12.5a3.2 3.2 0 0 1-4.5-4.5l5.3-5.3a2.1 2.1 0 0 1 3 3L6.6 10.9a1 1 0 0 1-1.5-1.5L9.8 4.7"/></svg>
              </button>
              <input id="file-input" type="file" multiple hidden>
              <span id="composer-hint" class="composer-hint"></span>
              <button id="send" class="send-btn" type="submit" title="发送" aria-label="发送" disabled>
                <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
              </button>
            </div>
          </div>
        </form>
        <div id="drop-veil" class="drop-veil hidden">松开即可把文件记进证据</div>
      </section>
    </main>

    <aside id="preview" class="preview hidden">
      <header class="preview-head">
        <div id="doc-tabs" class="segmented small"></div>
        <button id="close-preview" class="icon-btn" type="button" title="收起" aria-label="收起预览">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </header>
      <article id="doc-view" class="doc-view"></article>
    </aside>
  </div>

  <div id="context-menu" class="context-menu hidden" role="menu"></div>

  <div id="sheet" class="sheet-backdrop hidden">
    <form id="create-form" class="sheet">
      <h2>新建产品</h2>
      <label class="field">
        <span>产品名</span>
        <input id="product-name" type="text" maxlength="40" required>
      </label>
      <label class="field">
        <span>一句话想法</span>
        <textarea id="product-idea" rows="3" required placeholder="想做什么，给谁用"></textarea>
      </label>
      <div class="field">
        <span>驱动方式</span>
        <div id="mode-options" class="mode-options"></div>
      </div>
      <p id="create-error" class="error"></p>
      <div class="sheet-actions">
        <button id="cancel-create" class="push-btn" type="button">取消</button>
        <button class="push-btn primary" type="submit">创建</button>
      </div>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
